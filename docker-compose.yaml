# docker compose up -d --build
# Settings come from .env next to this file (see .env.example). Set NODE_ENV=production there
# (or remove the line) and leave HOST unset: inside the container ToDoDAV must listen on 0.0.0.0.
services:
  tododav:
    build: .
    image: tododav
    container_name: tododav
    restart: unless-stopped
    env_file: .env
    # Bun as PID 1 would ignore SIGTERM, so `docker compose down` would wait 10 s and then kill it.
    init: true
    # Open to any address, so a fresh install can be checked with `GET /api/status` from anywhere.
    # Plain HTTP from the internet gets 403 on everything else in production. Once a reverse proxy
    # runs on this machine, use `127.0.0.1:3852:3852` so only programs on the host can reach it.
    ports:
      - 3852:3852